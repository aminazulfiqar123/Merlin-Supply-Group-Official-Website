name: Prepare Merlin Supply Group for independent Vercel hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Add independent Vercel migration audit' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect source for platform dependencies
        run: |
          echo '--- Platform references in app source/config ---'
          grep -RInE 'higgsfield|@higgsfield|cloudflare:workers|HF_[A-Z_]+|wrangler' app/src app/package.json app/vite.config.ts app/wrangler.jsonc app/app.manifest.json --exclude='*.map' || true
          echo '--- All external image/API hosts ---'
          grep -RhoE 'https?://[^"'"'"' )}]+' app/src app/public app/data 2>/dev/null | sort -u | head -100 || true
          echo '--- Package manifest ---'
          cat app/package.json
      - name: Save audit as workflow artifact
        run: |
          mkdir -p /tmp/audit
          grep -RInE 'higgsfield|@higgsfield|cloudflare:workers|HF_[A-Z_]+|wrangler' app/src app/package.json app/vite.config.ts app/wrangler.jsonc app/app.manifest.json --exclude='*.map' > /tmp/audit/platform-references.txt || true
          cp app/package.json /tmp/audit/package.json
      - uses: actions/upload-artifact@v4
        with:
          name: vercel-independence-audit
          path: /tmp/audit/
