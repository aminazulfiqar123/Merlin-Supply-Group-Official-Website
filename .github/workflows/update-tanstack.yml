name: Update TanStack Start security patch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Update TanStack Start security patch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update vulnerable package and rebuild
        run: |
          cd app
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.dependencies['@tanstack/react-start']='1.168.60'; fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\\n')"
          bun install
          bun run build
      - name: Commit security update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/package.json app/bun.lock
          if ! git diff --cached --quiet; then
            git commit -m 'Update TanStack Start security patch'
            git push
          fi
