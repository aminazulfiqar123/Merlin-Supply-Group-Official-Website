name: Import Merlin Supply Group website source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Initialize source import workflow' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download current website source
        run: |
          curl --fail --location --silent --show-error \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3Ky10YmHenVSMRzos9pGvJmiNcX/57bb0135-34b5-4c03-be5f-241b56ed3ceb.zip' \
            --output /tmp/merlin-source.zip
          unzip -q /tmp/merlin-source.zip -d /tmp/merlin-source
      - name: Copy website files into repository
        run: |
          cp -a /tmp/merlin-source/. .
          rm -f .github/workflows/import-source.yml
      - name: Commit complete website source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Import current Merlin Supply Group website source'
            git push
          fi
